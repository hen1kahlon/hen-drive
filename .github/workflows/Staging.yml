name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Patch wrangler output for staging
        run: |
          jq '.name = "tanstack-start-app-staging" | del(.custom_domains)' \
            .output/server/wrangler.json > /tmp/wrangler-staging.json
          mv /tmp/wrangler-staging.json .output/server/wrangler.json
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
