name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Patch wrangler output for production
        run: |
          jq '. + {"custom_domains": ["hendrive.co.il"]}' \
            .output/server/wrangler.json > /tmp/wrangler-prod.json
          mv /tmp/wrangler-prod.json .output/server/wrangler.json
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
